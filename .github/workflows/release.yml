name: Release

# Runs on release-please tags only (one plain vX.Y.Z per ADR 0003).
# Filename is final: npm trusted publishing pins user zzacong -> repo
# fleet -> this workflow file, so never casually rename it.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  goreleaser:
    name: GoReleaser (tarballs + checksums)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    name: npm (OIDC trusted publishing, no token)
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          version: 11
          # Node 24 bundles npm 11, which supports OIDC trusted publishing
          # (>= 11.5.1). Node 22 bundles npm 10, and `npm install -g` does
          # not replace the runtime-bundled npm on PATH — the old Upgrade
          # npm step reported success while `npm --version` stayed 10.9.8.
          runtime: node@24
          cache: true
          require-lockfile: true

      # Fail fast if the runtime ever ships an npm without OIDC support.
      - name: Assert npm supports OIDC
        run: |
          npm --version
          node -e "const [maj, min] = require('node:child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (maj < 11 || (maj === 11 && min < 5)) { console.error('npm >= 11.5.1 required for OIDC trusted publishing'); process.exit(1) }"

      # Order matters: build first, then stamp the tag version into all five
      # package.json files (rewriting workspace:* to exact versions) right
      # before publish. Stamped versions are never committed back to git.
      - name: Build platform binaries and stamp versions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "fleet release: building and stamping $VERSION"
          FLEET_VERSION="$VERSION" node npm/build.mjs
          node npm/stamp.mjs "$VERSION"

      # Platforms first, wrapper last (ordering lives in npm/publish.mjs:
      # the wrapper's optionalDependencies resolve at install time, so every
      # platform tarball must be live first).
      - name: Publish packages
        run: node npm/publish.mjs
