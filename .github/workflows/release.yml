name: Release

# Runs on release-please tags only (one plain vX.Y.Z per ADR 0003).
# Filename is final: npm trusted publishing pins user zzacong -> repo
# fleet -> this workflow file, so never casually rename it.
#
# Order is load-bearing: npm-publish runs FIRST so a failed publish leaves
# no binaries attached to the GitHub release. release-please creates the tag
# and the release object before this workflow runs, so they cannot be gated
# behind publish success — recovery is `gh run rerun` on the tag once
# publish.mjs skips versions already on the registry (idempotent retry).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # actions/setup-node is the sole owner of node+npm in this job.
      # pnpm/setup was tried: it downloads the node runtime but does not
      # put its bundled npm on PATH (v0.1.1 run: node 24.20.0 installed,
      # `npm` still the runner image's 10.9.8), and npm 10 cannot do OIDC.
      # Node 24 bundles npm 11. Do NOT add pnpm/setup here — two owners
      # fight and the image npm wins. Nothing in this job uses node_modules.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Fail fast if the runtime ever ships an npm without OIDC support.
      - name: Assert npm supports OIDC
        run: |
          npm --version
          node -e "const [maj, min] = require('node:child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (maj < 11 || (maj === 11 && min < 5)) { console.error('npm >= 11.5.1 required for OIDC trusted publishing'); process.exit(1) }"

      # Order matters: build first, then stamp the tag version into all five
      # package.json files (rewriting workspace:* to exact versions) right
      # before publish. Stamped versions are never committed back to git.
      - name: Build platform binaries and stamp versions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "fleet release: building and stamping $VERSION"
          FLEET_VERSION="$VERSION" node npm/build.mjs
          node npm/stamp.mjs "$VERSION"

      # Platforms first, wrapper last (ordering lives in npm/publish.mjs:
      # the wrapper's optionalDependencies resolve at install time, so every
      # platform tarball must be live first). Published with the npm CLI
      # (not pnpm publish) — it is the reference OIDC implementation.
      - name: Publish packages
        run: node npm/publish.mjs

  goreleaser:
    needs: npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
