name: Release

# Disabled: not ready for automated releases yet.
# To re-enable, restore: on: push: tags: ["v*"]
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
