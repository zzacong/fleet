name: Release

# Runs on release-please tags (one plain vX.Y.Z per ADR 0003), and as a
# dry-run rehearsal via workflow_dispatch on any branch.
# Filename is final: npm trusted publishing pins user zzacong -> repo
# fleet -> this workflow file, so never casually rename it.
#
# Order is load-bearing: npm-publish runs FIRST so a failed publish leaves
# no binaries attached to the GitHub release — cleanup-on-failure then
# deletes the release object and the tag, and the version re-cuts cleanly.
# If only goreleaser fails, nothing is deleted (npm already owns the
# version on the registry); rerun the workflow on the tag instead.
# Recovery is: fix forward, push, release-please re-opens the same version
# (publish.mjs skips name@version pairs already on the registry, so a
# partially published version heals on re-cut).
on:
  push:
    tags: ["v*.*.*"]
  # Rehearsal: dispatch on any branch to run the real npm-publish job (same
  # checkout, setup actions, PATH order) with --dry-run. Proves build + stamp
  # + pack in the actual job environment — the thing the dry-run mirror on
  # PRs cannot prove. The input only ever ADDS --dry-run; a real publish
  # happens on tag pushes exclusively.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse (publish with --dry-run, no goreleaser)"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # actions/setup-node is the sole owner of node+npm in this job.
      # pnpm/setup was tried: it downloads the node runtime but does not
      # put its bundled npm on PATH (v0.1.1 run: node 24.20.0 installed,
      # `npm` still the runner image's 10.9.8), and npm 10 cannot do OIDC.
      # Node 24 bundles npm 11. Do NOT add pnpm/setup here — two owners
      # fight and the image npm wins. Nothing in this job uses node_modules.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Fail fast if the runtime ever ships an npm without OIDC support.
      - name: Assert npm supports OIDC
        run: node npm/assert-npm-oidc.mjs

      # Order matters: build first, then stamp the tag version into all five
      # package.json files (rewriting workspace:* to exact versions) right
      # before publish. Stamped versions are never committed back to git.
      - name: Build platform binaries and stamp versions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Tag pushes carry vX.Y.Z; rehearsal dispatches carry a branch name,
          # which stamp.mjs rejects — fall back to the never-published 0.0.0.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || VERSION="0.0.0"
          echo "fleet release: building and stamping $VERSION"
          FLEET_VERSION="$VERSION" node npm/build.mjs
          node npm/stamp.mjs "$VERSION"

      # Platforms first, wrapper last (ordering lives in npm/publish.mjs:
      # the wrapper's optionalDependencies resolve at install time, so every
      # platform tarball must be live first). Published with the npm CLI
      # (not pnpm publish) — it is the reference OIDC implementation.
      - name: Publish packages
        run: node npm/publish.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

  goreleaser:
    needs: npm-publish
    # Tag pushes only. A rehearsal dispatch stops after npm: goreleaser on a
    # branch ref would create a real GitHub release for it.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Unwind only on npm-publish failure: nothing was published, so deleting
  # the tag and the release-please release object gives a clean re-cut
  # (release-please re-opens the same version PR on the next push to main;
  # publish.mjs skips name@version pairs already on the registry, so a
  # partially published version heals on re-cut). Never hand-repaired.
  #
  # When only goreleaser failed, KEEP everything: the npm packages for that
  # version are already on the registry and immutable, so deleting the tag
  # would manufacture the exact npm-has-it/GitHub-doesn't orphan this job
  # exists to prevent. Recovery is `gh run rerun` on the tag — npm publish
  # skips, goreleaser retries.
  cleanup-on-failure:
    needs: [npm-publish, goreleaser]
    if: ${{ always() && github.event_name == 'push' && needs.npm-publish.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete orphaned release and tag
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$GITHUB_REF_NAME" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
