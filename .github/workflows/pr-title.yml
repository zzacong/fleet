name: pr-title

# Squash merges take the PR title as the commit message on main, and
# release-please infers semver from that message (ADR 0003). A plain-English
# title silently skips the release, so validate it here. Path filtering (see
# `exclude-paths` in release-please-config.json) means a mistyped
# feat(www)/feat(skills) cannot cut a release; this check only enforces the
# conventional shape.
on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # deps is load-bearing for release-please (ADR 0003); the rest is
          # the action's default set.
          types: |
            feat
            fix
            docs
            chore
            ci
            refactor
            style
            test
            perf
            build
            revert
            deps
