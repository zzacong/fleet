name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: fmt · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Same version the Makefile's lint target expects locally.
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.13.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      - name: lint · typecheck · test
        run: pnpm run check:ci

      - name: Build
        run: make build

      - name: Build docs (Starlight)
        run: pnpm --filter www build

  release-readiness:
    name: release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Mirrors the Release workflow's npm-publish job: setup-node owns
      # node+npm, same OIDC assert. Runs on every PR — including
      # release-please release PRs — so a broken publish setup blocks the
      # merge instead of cutting a broken version. Keep in sync with
      # release.yml.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Assert npm supports OIDC
        run: |
          npm --version
          node -e "const [maj, min] = require('node:child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (maj < 11 || (maj === 11 && min < 5)) { console.error('npm >= 11.5.1 required for OIDC trusted publishing'); process.exit(1) }"

      # Synthetic version, never published (--dry-run): exercises build +
      # stamp + pack + publish plumbing only. --no-provenance: this check
      # performs no OIDC exchange; the Release workflow publishes with
      # provenance.
      - name: Build, stamp, and dry-run publish
        run: |
          FLEET_VERSION=0.0.0 node npm/build.mjs
          node npm/stamp.mjs 0.0.0
          node npm/publish.mjs --dry-run --no-provenance
