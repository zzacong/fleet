name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: fmt · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod

      # Same version the Makefile's lint target expects locally.
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.13.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS/TS tooling
        run: pnpm install --frozen-lockfile

      - name: lint · typecheck · test
        run: pnpm run check:ci

      - name: Build
        run: make build

      - name: Build docs (Starlight)
        run: pnpm --filter docs build
